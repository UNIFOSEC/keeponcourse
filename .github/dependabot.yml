# Weekly dependency updates. Each folder's updates arrive as one grouped pull
# request, and CI tests it before anything merges. Security fixes come
# separately, as soon as an advisory is published.
version: 2
updates:
  # The course API (app.js) is a graded course deliverable, so it stays on its
  # current major versions (e.g. Express 4); only minor and patch updates
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      api: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      web: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /coach
    schedule: { interval: weekly, day: monday }
    groups:
      coach: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
