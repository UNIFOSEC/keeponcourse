# Tests every push and pull request. On main, once everything passes, it can
# also deploy (see the deploy job at the bottom).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  api:
    name: Course API (app.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Web app (type-check, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  coach:
    name: Coach Worker (type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coach
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: coach/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails on high or critical advisories; Dependabot opens the fixes
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: coach

  # Deploys only after every check above passes, so a change that breaks
  # something never reaches keeponcourse.com.
  #
  # Off until you set it up (README → "Deploys"): add the repository secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, set the repository variable
  # DEPLOY_FROM_CI to true, and disconnect Workers Builds in Cloudflare.
  deploy:
    name: Deploy to Cloudflare
    needs: [api, web, coach, e2e, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_FROM_CI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://keeponcourse.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            coach/package-lock.json
      - name: Deploy the Coach Worker
        working-directory: coach
        run: |
          npm ci
          npx wrangler deploy
      - name: Deploy the web app (builds first, see web/wrangler.jsonc)
        working-directory: web
        run: |
          npm ci
          npx wrangler deploy
      - name: Check the live site
        run: |
          curl --fail --silent --show-error --max-time 20 https://keeponcourse.com/ | grep -q "KeepOnCourse"
          curl --fail --silent --show-error --max-time 20 https://codecrafthub-coach.adatt.workers.dev/health
