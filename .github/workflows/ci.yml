# Tests every push and pull request. On main, once everything passes, it can
# also deploy (see the deploy job at the bottom).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  api:
    name: Course API (app.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Web app (type-check, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  coach:
    name: Coach Worker (type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coach
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: coach/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails on high or critical advisories; Dependabot opens the fixes
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: coach

  # Deploys only after every check above passes, so a change that breaks
  # something never reaches keeponcourse.com.
  #
  # Runs once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist
  # (repository secrets, or secrets of the "production" environment); until
  # then it only leaves a notice. See README → "Deploys".
  deploy:
    name: Deploy to Cloudflare
    needs: [api, web, coach, e2e, audit]
    # Pushes to main, or "Run workflow" on main in the Actions tab
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://keeponcourse.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that deploys are set up
        id: setup
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy from CI."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            coach/package-lock.json
      - name: Deploy the Coach Worker
        if: steps.setup.outputs.ready == 'true'
        working-directory: coach
        run: |
          npm ci
          npx wrangler deploy
      - name: Deploy the web app (builds first, see web/wrangler.jsonc)
        if: steps.setup.outputs.ready == 'true'
        working-directory: web
        run: |
          npm ci
          npx wrangler deploy
      - name: Check the live site
        if: steps.setup.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --max-time 20 https://keeponcourse.com/ | grep -q "KeepOnCourse"
          curl --fail --silent --show-error --max-time 20 https://codecrafthub-coach.adatt.workers.dev/health
