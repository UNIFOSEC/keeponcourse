# The app now lives at https://keeponcourse.com (Cloudflare, see web/wrangler.jsonc).
# This keeps the old GitHub Pages address working: every page there forwards
# to the same place on keeponcourse.com, keeping the #/route.
name: Redirect GitHub Pages to keeponcourse.com

on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the redirect pages
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>KeepOnCourse has moved</title>
              <link rel="canonical" href="https://keeponcourse.com/" />
              <meta name="robots" content="noindex" />
              <meta http-equiv="refresh" content="0; url=https://keeponcourse.com/" />
              <script>location.replace("https://keeponcourse.com/" + location.hash);</script>
            </head>
            <body>
              <p>KeepOnCourse has moved to <a href="https://keeponcourse.com/">keeponcourse.com</a>.</p>
            </body>
          </html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
