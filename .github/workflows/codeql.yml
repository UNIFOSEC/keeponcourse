# Static security analysis of the JavaScript and TypeScript code.
# Findings appear under the repository's Security tab → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 6 * * 1" # weekly, Monday morning (UTC), to catch newly added queries
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/test"
              - "**/e2e"
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
